<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Watermark Remover - TRỊNH HẢI HOÀN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-icon">✦</span>
      <span class="topbar-title">Gemini Watermark Remover - TRỊNH HẢI HOÀN</span>
    </div>
    <div class="topbar-meta">
      <span class="badge">Local · Private</span>
      <span class="badge">PNG · JPG · WebP</span>
    </div>
  </header>

  <!-- Main workspace -->
  <main class="workspace">

    <!-- Left: Upload + Controls -->
    <section class="panel panel-left" aria-label="Upload và điều khiển">

      <!-- Drop zone -->
      <div
        id="drop-zone"
        class="dropzone"
        role="button"
        tabindex="0"
        aria-label="Kéo thả hoặc nhấn để chọn ảnh"
      >
        <input
          type="file"
          id="file-input"
          accept="image/*"
          multiple
          aria-label="Chọn file ảnh"
        />
        <div class="dropzone-idle" id="dz-idle">
          <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="dropzone-label">Kéo ảnh vào đây</p>
          <p class="dropzone-hint">hoặc nhấn để chọn · PNG, JPG, WebP</p>
        </div>
        <div class="dropzone-loaded hidden" id="dz-loaded">
          <svg class="dropzone-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="dropzone-loaded-name" id="loaded-name">—</p>
          <p class="dropzone-hint">Nhấn để đổi ảnh</p>
        </div>
      </div>

      <!-- Status -->
      <div class="status-row" id="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-msg" id="status-msg">Chờ ảnh...</span>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="btn-process" class="btn btn-primary" disabled aria-label="Xóa watermark Gemini">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
          </svg>
          Xóa Watermark
        </button>
        <button id="btn-save" class="btn btn-secondary" disabled aria-label="Lưu ảnh đã xử lý">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z"/>
            <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z"/>
          </svg>
          Lưu ảnh
        </button>
        <button id="btn-reset" class="btn btn-ghost" aria-label="Hủy (Chọn lại ảnh)">
          Hủy (Chọn lại ảnh)
        </button>
        <button id="btn-save-all" class="btn btn-ghost hidden" aria-label="Tải tất cả ảnh">
          Tải tất cả
        </button>
        <label class="overwrite-label hidden" id="overwrite-wrap">
          <input type="checkbox" id="chk-overwrite" />
          Ghi đè ảnh gốc
        </label>
      </div>

      <!-- Batch queue -->
      <div class="queue hidden" id="queue">
        <div class="queue-header">
          <span class="queue-title">Batch</span>
          <span class="queue-progress-text" id="q-progress-text">0 / 0</span>
        </div>
        <div class="queue-track">
          <div class="queue-fill" id="q-progress-bar"></div>
        </div>
        <ul class="queue-list" id="queue-list" aria-label="Danh sách file"></ul>
      </div>

    </section>

    <!-- Right: Before / After preview -->
    <section class="panel panel-right" aria-label="Xem trước ảnh">

      <div class="preview-header">
        <h2 class="preview-title">So sánh</h2>
        <div class="preview-tabs">
          <button class="tab active" id="tab-split" aria-pressed="true">Split</button>
          <button class="tab" id="tab-before" aria-pressed="false">Trước</button>
          <button class="tab" id="tab-after" aria-pressed="false">Sau</button>
        </div>
      </div>

      <!-- Split view -->
      <div class="compare-grid" id="view-split">
        <div class="img-box">
          <span class="img-label">TRƯỚC</span>
          <img id="before-img" class="preview-img" alt="Ảnh gốc" draggable="false"/>
          <div class="img-empty" id="before-empty">
            <span>Chưa có ảnh</span>
          </div>
        </div>
        <div class="img-box">
          <span class="img-label img-label--after">SAU</span>
          <img id="after-img" class="preview-img" alt="Ảnh sau xử lý" draggable="false"/>
          <div class="img-empty" id="after-empty">
            <span>Chưa xử lý</span>
          </div>
        </div>
      </div>

      <!-- Single views -->
      <div class="single-view hidden" id="view-before">
        <img id="before-img-2" class="preview-img preview-img--full" alt="Ảnh gốc" draggable="false"/>
        <div class="img-empty" id="before-empty-2"><span>Chưa có ảnh</span></div>
      </div>
      <div class="single-view hidden" id="view-after">
        <img id="after-img-2" class="preview-img preview-img--full" alt="Ảnh sau xử lý" draggable="false"/>
        <div class="img-empty" id="after-empty-2"><span>Chưa xử lý</span></div>
      </div>

    </section>
  </main>

</div>

<script src="assets/gemini-sdk.js"></script>
<script src="watermark-detector.js"></script>
<script src="app.js"></script>
</body>
</html>
